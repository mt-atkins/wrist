# XcodeGen spec. Run `make project` to generate Wrist.xcodeproj.
name: Wrist
options:
  bundleIdPrefix: com.distyll
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    watchOS: "10.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Wrist:
    type: application
    platform: iOS
    sources:
      - path: Wrist
        excludes: ["Info.plist"]
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Wrist
        PRODUCT_BUNDLE_IDENTIFIER: com.distyll.wrist
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Wrist/Info.plist
      properties:
        CFBundleDisplayName: Wrist
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Wrist records voice captures so it can transcribe and summarize them for you.
        NSSpeechRecognitionUsageDescription: Wrist transcribes your captures on-device so you can search and summarize them.
        NSRemindersFullAccessUsageDescription: Wrist can send the action items from a capture to Reminders.
    dependencies:
      - target: WristWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  WristWatch:
    type: application
    platform: watchOS
    sources:
      - path: WristWatch
        excludes: ["Info.plist"]
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: WristWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.distyll.wrist.watchkitapp
        SKIP_INSTALL: YES
    info:
      path: WristWatch/Info.plist
      properties:
        CFBundleDisplayName: Wrist
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.distyll.wrist
        WKBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Wrist records what you say so your iPhone can turn it into notes and to-dos.

  WristTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WristTests]
    dependencies:
      - target: Wrist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.distyll.wrist.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wrist.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Wrist
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Wrist:
    build:
      targets:
        Wrist: all
        WristWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [WristTests]
    archive:
      config: Release
  WristWatch:
    build:
      targets:
        WristWatch: all
    run:
      config: Debug
