name: Verify MVP
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wrist-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import glob, os, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              if 'beta' in app.lower():
                  continue
              developer = app + '/Contents/Developer'
              env = dict(os.environ, DEVELOPER_DIR=developer)
              result = subprocess.run(['xcodebuild', '-version'], env=env, text=True, capture_output=True)
              if result.returncode == 0:
                  version = tuple(map(int, result.stdout.splitlines()[0].split()[1].split('.')))
                  if version[0] >= 26:
                      candidates.append((version, developer))
          if not candidates:
              raise SystemExit('Stable Xcode 26+ is required')
          selected = max(candidates)[1]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('DEVELOPER_DIR=' + selected + '\n')
          print('Selected', selected)
          PY
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Select available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          candidates = [(runtime, d['udid']) for runtime, group in devices.items() if 'iOS-26' in runtime for d in group if d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('An iOS 26 simulator runtime is required')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('WRIST_TEST_DESTINATION=platform=iOS Simulator,id=' + sorted(candidates)[-1][1] + '\n')
          PY
      - name: Build both apps and run unit and UI tests
        run: bash scripts/verify-mac.sh
      - name: Save build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrist-verification
          path: |
            build/*.log
            build/DerivedData/Logs/Test/*.xcresult
          retention-days: 7

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
